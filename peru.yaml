# peru.yaml — vendor desk dependencies from upstream Urbit.
#
# Run `./scripts/sync-deps.sh` (or `peru sync`) to populate desk-deps/ with the
# files picked below. desk-deps/ is an entirely-gitignored vendored tree kept
# SEPARATE from our own source in desk/. A desk is assembled by copying
# desk-deps/ in first (with --delete) and then our desk/ on top — see
# scripts/assemble-desk.sh.
#
# Why peru instead of rsyncing all of pkg/base-dev: base-dev ships ~92 files
# (bitcoin/eth-adjacent, language-server, wasm/umd, woff2, png, ...). The new
# kernel builds EVERY mark present on a desk, so copying the whole tree in pulls
# files this desk does not use, some of which fail to compile on the target
# kelvin. We pick only the transitively-required subset (computed from the
# import closure of desk/).
#
# IMPORTANT: do NOT add anything this repo owns to the pick lists. Everything
# landscape owns (docket, hark, treaty, settings, storage, the *-json libs, the
# glob/svg/charge marks, ...) already lives committed in desk/.

imports:
  base: desk-deps/

# %base (urbit/urbit) dev dependencies. Pinned to the 408 kelvin tag, matching
# desk/sys.kelvin ([%zuse 408]). To build against a different kernel, change
# `rev` here on your branch.
git module base:
  url: https://github.com/urbit/urbit.git
  rev: 408k-rc2
  pick:
    # libraries the desk imports (transitive closure of desk/):
    #   agents -> default-agent/dbug/verb/agentio
    #   default-agent -> skeleton; server/mip standalone
    #   threads (ted/) -> strandio -> strand (+ sur/spider)
    #   lib/test-agent -> test
    - pkg/base-dev/lib/agentio.hoon
    - pkg/base-dev/lib/dbug.hoon
    - pkg/base-dev/lib/default-agent.hoon
    - pkg/base-dev/lib/mip.hoon
    - pkg/base-dev/lib/server.hoon
    - pkg/base-dev/lib/skeleton.hoon
    - pkg/base-dev/lib/strand.hoon
    - pkg/base-dev/lib/strandio.hoon
    - pkg/base-dev/lib/test.hoon
    - pkg/base-dev/lib/verb.hoon
    # thread types (spider sur) + verb sur (pulled in by lib/verb)
    - pkg/base-dev/sur/spider.hoon
    - pkg/base-dev/sur/verb.hoon
    # standard marks clay needs to build/serve the desk, plus the marks our own
    # marks convert through (grad/grow/grab over %noun, %mime, %json)
    - pkg/base-dev/mar/bill.hoon
    - pkg/base-dev/mar/hoon.hoon
    - pkg/base-dev/mar/kelvin.hoon
    - pkg/base-dev/mar/mime.hoon
    - pkg/base-dev/mar/noun.hoon
    - pkg/base-dev/mar/txt.hoon
    - pkg/base-dev/mar/json.hoon
    - pkg/base-dev/mar/css.hoon
    - pkg/base-dev/mar/htm.hoon
    - pkg/base-dev/mar/html.hoon
  export: pkg/base-dev
